name: splitspeak
options:
  bundleIdPrefix: fun.withus
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
targets:
  Spike:
    type: application
    platform: macOS
    sources: [Spike]
    settings:
      GENERATE_INFOPLIST_FILE: YES
      DEVELOPMENT_TEAM: ""
      CODE_SIGN_IDENTITY: "-"
      CODE_SIGN_STYLE: Manual
      PRODUCT_BUNDLE_IDENTIFIER: fun.withus.splitspeak.spike
  splitspeak:
    type: application
    platform: iOS
    sources: [App]
    dependencies:
      - target: SCTCore
      - target: SCTAudio
      - target: SCTConversation
      - target: SCTPipeline
    settings:
      GENERATE_INFOPLIST_FILE: YES
      DEVELOPMENT_TEAM: ""
  SCTAudio:
    type: framework
    platform: iOS
    sources: [Modules/SCTAudio/Sources]
    dependencies:
      - target: SCTCore
    settings:
      GENERATE_INFOPLIST_FILE: YES
  SCTCore:
    type: framework
    platform: iOS
    sources: [Modules/SCTCore/Sources]
    settings:
      GENERATE_INFOPLIST_FILE: YES
  SCTConversation:
    type: framework
    platform: iOS
    sources: [Modules/SCTConversation/Sources]
    dependencies:
      - target: SCTCore
    settings:
      GENERATE_INFOPLIST_FILE: YES
  SCTPipeline:
    type: framework
    platform: iOS
    sources: [Modules/SCTPipeline/Sources]
    dependencies:
      - target: SCTCore
    settings:
      GENERATE_INFOPLIST_FILE: YES
