name: splitspeak
options:
  bundleIdPrefix: fun.withus
targets:
  splitspeak:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources: [App]
    dependencies:
      - target: SCTCore
      - target: SCTAudio
    settings:
      GENERATE_INFOPLIST_FILE: YES
      DEVELOPMENT_TEAM: ""
  SCTAudio:
    type: framework
    platform: iOS
    sources: [Modules/SCTAudio/Sources]
    dependencies:
      - target: SCTCore
    settings:
      GENERATE_INFOPLIST_FILE: YES
  SCTCore:
    type: framework
    platform: iOS
    sources: [Modules/SCTCore/Sources]
    settings:
      GENERATE_INFOPLIST_FILE: YES
